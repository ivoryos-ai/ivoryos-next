<!doctype html><html><head><meta charset="utf-8">{{fontLink}}<style>
/* The IvoryOS NextGen cover: flat ink navy, the screenshot shown straight on in a frame,
   regular-weight type in sentence case, one teal. Same inputs as the classic cover. */
*{box-sizing:border-box;margin:0}
body{width:1280px;height:720px;overflow:hidden;position:relative;color:{{color.text}};
    font-family:{{font.family}};background:{{cover.background}};-webkit-font-smoothing:antialiased}
.grid{position:absolute;inset:0;opacity:.6;
    background-image:linear-gradient({{color.hairline}} 1px,transparent 1px),linear-gradient(90deg,{{color.hairline}} 1px,transparent 1px);
    background-size:48px 48px;-webkit-mask-image:radial-gradient(85% 95% at 80% 35%,#000,transparent 72%)}
.glow{position:absolute;inset:0;
    background:radial-gradient(46% 56% at 84% 14%,rgba(69,196,181,.22),transparent 70%),
               radial-gradient(40% 50% at 4% 104%,rgba(169,190,213,.12),transparent 70%)}
.shot{position:absolute;left:624px;top:150px;width:940px;border-radius:14px;overflow:hidden;background:{{color.panel}};
    box-shadow:0 0 0 1px rgba(255,255,255,.14),0 40px 90px rgba(3,7,14,.62)}
.shot img{display:block;width:100%}
.text{position:absolute;left:72px;top:60px;width:520px}
.brand{display:flex;align-items:center;gap:14px}
.brand img{height:50px;display:block}
.brand span{font-size:31px;font-weight:600;letter-spacing:-.015em}
.brand em{font-style:normal;font-size:14px;font-weight:500;color:{{color.steel}};padding:3px 10px 4px;border-radius:999px;
    box-shadow:inset 0 0 0 1px rgba(169,190,213,.38);margin-left:2px}
.brand em:empty{display:none}
.kicker{display:inline-flex;align-items:center;gap:10px;margin-top:92px;font-size:19px;font-weight:500;color:{{color.soft}}}
.kicker::before{content:"";width:26px;height:3px;border-radius:2px;background:{{color.accent}}}
.kicker.none{visibility:hidden}
.headline{font-size:176px;font-weight:650;line-height:.94;letter-spacing:-.05em;margin-top:10px}
.headline.words{font-size:90px;line-height:1;letter-spacing:-.04em;margin-top:14px}
ul{list-style:none;padding:0;margin-top:38px;font-size:23px;line-height:1.3;color:{{color.soft}}}
li{padding:12px 0 12px 32px;position:relative;box-shadow:inset 0 1px 0 {{color.hairline}}}
li::before{content:"";position:absolute;left:2px;top:1.18em;width:16px;height:2px;border-radius:1px;background:{{color.accent}}}
.tagline{position:absolute;left:72px;bottom:42px;font-size:18px;color:{{color.muted}}}
</style></head><body>
<div class="grid"></div><div class="glow"></div>
<div class="shot"><img src="{{shot}}" alt=""></div>
<div class="text">
    <div class="brand"><img src="{{logo}}" alt=""><span>{{product.name}}</span><em>{{product.badge}}</em></div>
    <div class="kicker {{kickerClass}}">{{kicker}}</div>
    <div class="headline {{size}}">{{headline}}</div>
    <ul>{{points}}</ul>
</div>
<div class="tagline">{{product.tagline}}</div>
</body></html>
